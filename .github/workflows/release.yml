name: release
run-name: release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Build mat.c
        run: ${{ matrix.compiler }} -O2 -Wall -Wextra -Werror -c mat.c -o mat.o

      - name: Run tests
        run: make check CC=${{ matrix.compiler }}

  release:
    name: GitHub Release
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HDR="$(grep '#define MAT_VERSION ' mat.h | head -1 | tr -d '"' | awk '{print $3}')"
          if [ "$TAG" != "$HDR" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MAT_VERSION \"$HDR\" in mat.h"
            exit 1
          fi
      - uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          args: --latest
      - name: Generate release notes
        run: echo "${{ steps.changelog.outputs.content }}" | tail -n +2 > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: mat.h

  publish:
    name: Publish to prefix.dev
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute archive sha256
        run: |
          URL="https://github.com/alvgaona/libmat/archive/${{ github.ref_name }}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          sed -i "s/ARCHIVE_SHA256/$SHA/" recipe.yaml
      - uses: prefix-dev/rattler-build-action@v0.2.25
        with:
          recipe-path: recipe.yaml
          upload-channel: libmat
        env:
          PREFIX_DEV_API_KEY: ${{ secrets.PREFIX_DEV_API_KEY }}
